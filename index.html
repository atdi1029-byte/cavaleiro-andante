<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#dff3d0">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Cavaleiro Andante</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Nunito:wght@700;800;900&display=swap">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <header id="header">
    <div class="brand">
      <img src="logo-144.png" alt="" class="brand-logo">
      <div class="brand-name">Cavaleiro <span>Andante</span></div>
      <button id="taste-btn" class="icon-btn" aria-label="What you like">✨</button>
    </div>

    <button id="origin-btn" class="origin-btn" aria-label="Change starting point">
      <span class="origin-dot"></span>
      <span class="origin-text">Near <b id="origin-label">Pasadena, MD</b></span>
      <span class="origin-change">Change</span>
    </button>

    <label class="search">
      <span class="search-icon" aria-hidden="true">🔎</span>
      <input id="search-input" type="search" enterkeyhint="search" autocomplete="off"
        placeholder="Search places by name…">
      <button id="search-clear" class="search-clear hidden" type="button" aria-label="Clear search">✕</button>
    </label>
  </header>

  <!-- Shown only when the starting point is outside the area the app covers -->
  <div id="notice" class="notice hidden"></div>

  <!-- Shown when it is raining (or about to) at the starting point -->
  <button id="rain-tip" class="rain-tip hidden"></button>

  <!-- Category photo cards -->
  <nav id="cats" aria-label="Categories"></nav>

  <!-- Chips that narrow the chosen category (Gems: abandoned, caves, forts…) -->
  <div id="subs" class="chip-row hidden"></div>

  <div id="controls">
    <div id="toolbar">
      <div class="seg" id="mode">
        <button data-mode="list" class="active">List</button>
        <button data-mode="map">Map</button>
      </div>
      <span id="count" class="count"></span>
      <button id="surprise-btn" class="surprise-btn">🎲 Surprise me</button>
    </div>
    <div id="filters">
      <div id="dist-pills" class="chip-row"></div>
      <button id="sort-btn" class="sort-btn" aria-label="Change sort order"></button>
    </div>
  </div>

  <main id="list-view">
    <div id="list"></div>
    <div id="more-sentinel"></div>
  </main>

  <section id="map-view" class="hidden">
    <div id="map"></div>
    <div id="map-layers" class="map-layers"></div>
    <div id="map-hint" class="map-hint hidden"></div>
    <button id="map-home" class="map-home" aria-label="Back to my starting point">◎</button>
    <div id="map-peek" class="hidden"></div>
  </section>

</div>

<!-- One bottom sheet, reused for place details, starting point and taste -->
<div id="sheet-backdrop" class="hidden">
  <div id="sheet" role="dialog" aria-modal="true">
    <div class="sheet-handle"></div>
    <button id="sheet-close" class="sheet-close" aria-label="Close">✕</button>
    <div id="sheet-body"></div>
  </div>
</div>

<div id="toast" class="hidden" role="status"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" defer></script>
<script type="module" src="js/app.js"></script>
<script>
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
